name: Terraform CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply (somente na branch main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve

      - name: Smoke test (verificação pós-deploy)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker ps
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080 | grep -q "Atualizado via pipeline"; then
              echo "Site no ar com o conteúdo esperado"
              exit 0
            fi
            echo "Tentativa $i/20: aguardando o site..."
            sleep 3
          done
          echo "Smoke test falhou"
          curl -sS http://localhost:8080 || true
          docker logs --tail 50 meu-container-web
          exit 1